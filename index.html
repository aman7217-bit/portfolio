<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Login Page</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(120deg, #5910a7, #90b8ff);
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .login-container {
        background: #fff;
        padding: 30px;
        width: 350px;
        border-radius: 12px;
        box-shadow: 0 15 30px rgba(0, 0, 0, 0.2);
      }
      .login-container h2 {
        text-align: center;
        margin-bottom: 25px;
        color: #333;
      }
      .name {
        margin-bottom: 15px;
      }
      .name label {
        display: block;
        margin-bottom: 6px;
        font-weight: bold;
        color: #555;
      }
      .name input {
        width: 100%;
        padding: 10px;
        border-radius: 6px;
        border: 1px solid #ccc;
        font-size: 14px;
      }
      .name input:focus {
        outline: none;
        border-color: #2575fc;
      }
      .login-btn {
        width: 100%;
        padding: 12px;
        background: #2575fc;
        border: none;
        color: #fff;
        font-size: 16px;
        border-radius: 6px;
        cursor: pointer;
        margin-top: 10px;
      }
      .login-btn:hover {
        background: #1260dd;
      }
      .extra {
        text-align: center;
        margin-top: 15px;
        font-size: 14px;
      }
      .extra a {
        text-decoration: none;
        color: #2575fc;
        font-weight: bold;
      }
    </style>
  </head>

  <body>
    <div class="login-container">
      <h2>Login</h2>
      <form>
        <div class="name">
          <label for="Username">Username</label>
          <input
            type="Username"
            id="username"
            placeholder="Enter your username"
            required
          /><br /><br />
        </div>

        <div class="name">
          <label for="Password">Password</label>
          <input
            type="password"
            id="password"
            placeholder="Enter your password"
            required
          /><br />
        </div>

        <button type="submit" class="Login-btn">Login</button><br />
      </form>
      <div class="extra">
        <p>New user? <a href="#">Creat Account</a></p>
      </div>
    </div>
  </body>
</html>
